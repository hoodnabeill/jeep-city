# Builds the three apps from the same React client:
#   Windows  → Jeep City installer (.exe, Tauri NSIS)        artifact "windows-installer"
#   Android  → debug APK (installable on any phone)           artifact "android-apk"
#   Phones   → web.zip + web.json: the screens alone, picked up by installed phone apps without reinstalling
#   iOS      → unsigned .ipa                                   artifact "ios-ipa"; installed with SideStore/AltStore,
#              which signs it with the phone owner's free Apple ID (no paid developer account)
# Runs on pushes to main, on version tags (v*) and by hand. A tag also attaches the files to a GitHub Release.
# Server addresses baked in as defaults: repository variable SERVER_URLS, e.g.
#   http://192.168.1.10/api,https://jc.example.com/api       (each device can change them on the login screen)
name: Apps
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  VITE_SERVER_URLS: ${{ vars.SERVER_URLS }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: npm ci --no-audit --no-fund
      - name: Build the installer
        run: npm run build -w @jc/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --no-audit --no-fund
      - name: Build web app and copy it into Android
        run: |
          npm run build:app -w @jc/client
          cd apps/mobile && npx cap sync android
      - name: Build APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # Over-the-air update for the installed phone apps (see apps/client/src/native.ts): the built screens and their checksum.
      - name: Pack the screens for phone updates
        run: |
          (cd apps/client/dist && zip -qr "$GITHUB_WORKSPACE/web.zip" .)
          node -e "const f=require(\"fs\"),c=require(\"crypto\");f.writeFileSync(\"web.json\",JSON.stringify({version:require(\"./apps/client/package.json\").version,sha256:c.createHash(\"sha256\").update(f.readFileSync(\"web.zip\")).digest(\"hex\")}))"
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: web.*
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Build web app and copy it into iOS
        run: |
          npm run build:app -w @jc/client
          cd apps/mobile && npx cap sync ios
      - name: Build the unsigned IPA
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination generic/platform=iOS -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "Jeep.City_$(node -p "require('../../../client/package.json').version").ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: apps/mobile/ios/App/*.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android, ios]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/windows-installer/*.exe
            out/android-apk/*.apk
            out/ios-ipa/*.ipa
            out/web-bundle/web.zip
            out/web-bundle/web.json
